name: Apply attribution privacy correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/privacy-release.yml']
permissions:
  contents: write
concurrency:
  group: attribution-privacy-correction
  cancel-in-progress: false
jobs:
  redact-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refresh release text and source snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/contents/releases/v0.1.md?ref=$GITHUB_SHA" -H "Accept: application/vnd.github.raw+json" > release-notes.md
          test -s release-notes.md
          gh release edit v0.1 --repo "$GH_REPO" --notes-file release-notes.md
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/v0.1" -f sha="$GITHUB_SHA" -F force=true --silent
